services:
  - type: web
    name: synora-coordination-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server.coordination_server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0